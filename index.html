<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marks Grading System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 40px auto;
      padding: 0 16px;
    }
    button {
      padding: 10px 16px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
    }
    .result-box {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 14px;
      margin-top: 18px;
      background-color: #fafafa;
    }
    .result-box p {
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <h2>Marks Grading System</h2>
  <p>Click the button below to enter student marks (0–100) and check the grade.</p>

  <button id="gradeBtn">Check Grade</button>

  <div class="result-box" id="output">
    <p>No marks evaluated yet.</p>
  </div>

  <script src="./script.js"></script>
</body>
</html>
